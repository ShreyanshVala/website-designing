<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Session 5 - Live Search Bar</title>

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
      }

      /* Header */

      header {
        background-color: #2874f0;
        padding: 20px;
        text-align: center;
        color: white;
      }

      header h1 {
        margin: 0 0 15px;
      }

      /* Search Container */

      .search-container {
        width: 90%;
        max-width: 650px;
        margin: 40px auto;
        position: relative;
      }

      #searchBox {
        width: 100%;
        padding: 15px 20px;
        font-size: 17px;
        border: 2px solid #2874f0;
        border-radius: 5px;
        outline: none;
      }

      #searchBox:focus {
        border-color: #0056d6;
      }

      /* Suggestion Dropdown */

      #suggestions {
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        background-color: white;
        border: 1px solid #ddd;
        border-top: none;
        border-radius: 0 0 5px 5px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);

        display: none;

        z-index: 1000;
      }

      .suggestion {
        padding: 14px 18px;
        cursor: pointer;
        border-bottom: 1px solid #eee;
      }

      .suggestion:last-child {
        border-bottom: none;
      }

      .suggestion:hover {
        background-color: #f5f5f5;
      }

      /* Highlight */

      .highlight {
        background-color: #fff176;
        font-weight: bold;
      }

      /* Product Info */

      .info {
        text-align: center;
        margin-top: 100px;
      }

      .info h2 {
        color: #333;
      }

      .info p {
        color: #666;
      }

      .price {
        color: green;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <!-- Header -->

    <header>
      <h1>🛒 ShopKart</h1>

      <p>Search for your favorite products</p>
    </header>

    <!-- Search -->

    <div class="search-container">
      <input
        type="text"
        id="searchBox"
        placeholder="Search for products..."
        autocomplete="off"
      />

      <div id="suggestions"></div>
    </div>

    <!-- Information -->

    <div class="info">
      <h2>Live Product Search</h2>

      <p>Start typing in the search box to see product suggestions.</p>

      <p>Maximum <strong>5 suggestions</strong> will be displayed.</p>
    </div>

    <!-- jQuery -->

    <script>
      $(document).ready(function () {
        // ==========================================
        // TASK 1 & 2
        // Fetch products from products.json
        // ==========================================

        let products = [];

        $.getJSON("products.json", function (data) {
          products = data;

          console.log("Products loaded:", products);
        }).fail(function () {
          console.log("Unable to load products.json");
        });

        // ==========================================
        // TASK 5
        // Function to limit suggestions to 5
        // ==========================================

        function limitSuggestions(items, maxItems = 5) {
          return items.slice(0, maxItems);
        }

        // ==========================================
        // TASK 2
        // Live Search using keyup event
        // ==========================================

        $("#searchBox").keyup(function () {
          let searchText = $(this).val().trim().toLowerCase();

          // If search box is empty
          if (searchText === "") {
            $("#suggestions").hide();

            return;
          }

          // Find matching products

          let matchingProducts = products.filter(function (product) {
            return product.name.toLowerCase().includes(searchText);
          });

          // ==========================================
          // TASK 5
          // Show maximum 5 suggestions
          // ==========================================

          matchingProducts = limitSuggestions(matchingProducts, 5);

          // Clear previous suggestions

          $("#suggestions").empty();

          // If no products found

          if (matchingProducts.length === 0) {
            $("#suggestions")
              .html("<div class='suggestion'>No products found</div>")
              .show();

            return;
          }

          // ==========================================
          // TASK 4
          // Highlight matching text
          // ==========================================

          matchingProducts.forEach(function (product) {
            let productName = product.name;

            /*
                        Escape special characters before
                        using user input inside RegExp.
                    */

            let escapedText = searchText.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

            let regex = new RegExp("(" + escapedText + ")", "gi");

            // Wrap matching text in span

            let highlightedName = productName.replace(
              regex,
              "<span class='highlight'>$1</span>",
            );

            // Add suggestion

            $("#suggestions").append(`

                        <div
                            class="suggestion"
                            data-name="${product.name}"
                        >

                            ${highlightedName}

                            <span class="price">
                                - ₹${product.price.toLocaleString("en-IN")}
                            </span>

                        </div>

                    `);
          });

          // Show dropdown

          $("#suggestions").show();
        });

        // ==========================================
        // TASK 3
        // Click suggestion
        // ==========================================

        $(document).on("click", ".suggestion", function () {
          let selectedProduct = $(this).data("name");

          // Put selected product in search box

          $("#searchBox").val(selectedProduct);

          // Close dropdown

          $("#suggestions").hide();
        });

        // ==========================================
        // Close dropdown when clicking outside
        // ==========================================

        $(document).click(function (event) {
          if (!$(event.target).closest(".search-container").length) {
            $("#suggestions").hide();
          }
        });
      });
    </script>
  </body>
</html>
