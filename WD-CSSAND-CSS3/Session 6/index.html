<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>CSS Session 6 - Lists, Tables & Forms</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- =========================================
         TASK 1 - FOOD LIST
         ========================================= -->

    <section class="food-section">
      <h1>My Favorite Foods</h1>

      <ul class="food-list">
        <li>🍕 Pizza</li>

        <li>🍔 Burger</li>

        <li>🍜 Noodles</li>

        <li>🍛 Biryani</li>

        <li>🥪 Sandwich</li>
      </ul>
    </section>

    <!-- =========================================
         TASK 2 - IPL MATCH TABLE
         ========================================= -->

    <section class="table-section">
      <h1>Recent IPL Matches</h1>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Team 1</th>
              <th>Team 2</th>
              <th>Score</th>
              <th>Winner</th>
            </tr>
          </thead>

          <tbody>
            <tr>
              <td>RCB</td>
              <td>CSK</td>
              <td>185/6 - 178/8</td>
              <td>RCB</td>
            </tr>

            <tr>
              <td>MI</td>
              <td>GT</td>
              <td>172/5 - 169/7</td>
              <td>MI</td>
            </tr>

            <tr>
              <td>KKR</td>
              <td>RR</td>
              <td>195/4 - 180/8</td>
              <td>KKR</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- =========================================
         TASK 3 - MUSIC APP SIGN-UP FORM
         ========================================= -->

    <section class="form-section">
      <div class="form-card">
        <h1>🎵 Music App</h1>

        <p>Create your account</p>

        <form>
          <!-- Username -->

          <label for="username"> Username </label>

          <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter your username"
            required
          />

          <!-- Email -->

          <label for="email"> Email </label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
          />

          <!-- Password -->

          <label for="password"> Password </label>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
          />

          <!-- Favorite Genre -->

          <label for="genre"> Favorite Genre </label>

          <select id="genre" name="genre">
            <option value="">Select Genre</option>

            <option value="bollywood">Bollywood</option>

            <option value="pop">Pop</option>

            <option value="rock">Rock</option>

            <option value="hiphop">Hip Hop</option>

            <option value="classical">Classical</option>
          </select>

          <!-- Submit Button -->

          <button type="submit">Create Account</button>
        </form>
      </div>
    </section>
  </body>
</html>
