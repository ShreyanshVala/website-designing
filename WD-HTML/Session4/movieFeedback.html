<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Booking Feedback</title>
  </head>
  <body>
    <h1>Movie Booking Feedback</h1>
    <form action="#" method="post">
      <p><strong>How would you rate your experience?</strong></p>
      <input type="radio" id="rating1" name="rating" value="1" />
      <label for="rating1">1 Star</label><br />
      <input type="radio" id="rating2" name="rating" value="2" />
      <label for="rating2">2 Stars</label><br />
      <input type="radio" id="rating3" name="rating" value="3" />
      <label for="rating3">3 Stars</label><br />
      <input type="radio" id="rating4" name="rating" value="4" />
      <label for="rating4">4 Stars</label><br />
      <input type="radio" id="rating5" name="rating" value="5" />
      <label for="rating5">5 Stars</label><br /><br />

      <p><strong>Which features did you use?</strong></p>
      <input type="checkbox" id="seat" name="features" value="seat selection" />
      <label for="seat">Seat Selection</label><br />
      <input type="checkbox" id="food" name="features" value="food order" />
      <label for="food">Food Order</label><br />
      <input type="checkbox" id="payment" name="features" value="payment" />
      <label for="payment">Payment</label><br /><br />

      <button type="submit">Send Feedback</button>
    </form>
  </body>
</html>
