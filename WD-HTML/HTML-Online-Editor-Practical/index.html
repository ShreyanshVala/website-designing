<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>HTML Online Editor Practical</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        padding: 30px;
      }

      h1 {
        color: #e23744;
      }

      .profile-card {
        width: 300px;
        padding: 20px;
        margin: 20px 0;
        background-color: white;
        text-align: center;
        border-radius: 10px;
        box-shadow: 0 2px 8px gray;
      }

      .profile-card img {
        width: 150px;
        height: 150px;
        border-radius: 50%;
      }

      table {
        border-collapse: collapse;
        width: 400px;
        background-color: white;
      }

      th,
      td {
        border: 1px solid black;
        padding: 12px;
        text-align: left;
      }

      th {
        background-color: #e23744;
        color: white;
      }

      button {
        padding: 12px 25px;
        background-color: #e23744;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      button:hover {
        background-color: #c62836;
      }
    </style>
  </head>

  <body>
    <!-- Task 1 -->
    <h1>Hello, Web World!</h1>

    <!-- Task 2 -->
    <h2>My Favorite IPL Player</h2>

    <div class="profile-card">
      <img src="https://placehold.co/150x150" alt="IPL Player" />

      <h2>Shubman Gill</h2>

      <p><strong>Team:</strong> Gujarat Titans</p>

      <p><strong>Role:</strong> Batsman</p>
    </div>

    <!-- Task 3 -->
    <h2>Restaurant Menu</h2>

    <table>
      <tr>
        <th>Dish Name</th>
        <th>Price</th>
      </tr>

      <tr>
        <td>Paneer Tikka</td>
        <td>₹250</td>
      </tr>

      <tr>
        <td>Veg Biryani</td>
        <td>₹220</td>
      </tr>

      <tr>
        <td>Masala Dosa</td>
        <td>₹150</td>
      </tr>
    </table>

    <!-- Task 4 -->
    <h2>Place Your Order</h2>

    <button onclick="alert('Order Placed!')">Order Now</button>
  </body>
</html>
