<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Session 7 - HTML5 APIs</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        color: #1f2937;
        margin: 0;
        padding: 24px;
      }

      .container {
        max-width: 900px;
        margin: 0 auto;
      }

      section {
        background: white;
        padding: 24px;
        border-radius: 12px;
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.08);
        margin-bottom: 24px;
      }

      h1, h2 {
        color: #111827;
      }

      button {
        padding: 10px 16px;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        font-weight: bold;
        cursor: pointer;
        margin-top: 10px;
      }

      button:hover {
        background: #1d4ed8;
      }

      #locationDisplay {
        margin-top: 12px;
        padding: 12px;
        background: #eff6ff;
        border-radius: 8px;
        font-weight: bold;
      }

      canvas {
        background: #fff;
        border: 2px solid #d1d5db;
        border-radius: 12px;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Session 7: HTML5 APIs</h1>

      <section>
        <h2>1. Save Spotify User in Local Storage</h2>
        <button id="saveSpotifyUser">Save Spotify User</button>
        <script>
          document.getElementById('saveSpotifyUser').addEventListener('click', function () {
            const username = prompt('Enter your Spotify username:');
            if (username) {
              localStorage.setItem('spotifyUser', username);
              alert('Saved username: ' + localStorage.getItem('spotifyUser'));
            }
          });
        </script>
      </section>

      <section>
        <h2>2. Save Favorite Food in Session Storage</h2>
        <button id="saveFoodBtn">Save Favorite Food</button>
        <script>
          document.getElementById('saveFoodBtn').addEventListener('click', function () {
            const food = prompt('Enter your favorite food:');
            if (food) {
              sessionStorage.setItem('favFood', food);
              alert('Saved favorite food: ' + sessionStorage.getItem('favFood'));
            }
          });
        </script>
      </section>

      <section>
        <h2>3. Show My Location</h2>
        <button id="locationBtn">Show My Location</button>
        <div id="locationDisplay">Location will appear here.</div>
        <script>
          document.getElementById('locationBtn').addEventListener('click', function () {
            if (!navigator.geolocation) {
              document.getElementById('locationDisplay').textContent = 'Geolocation is not supported by your browser.';
              return;
            }

            navigator.geolocation.getCurrentPosition(
              function (position) {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                document.getElementById('locationDisplay').textContent = 'Latitude: ' + lat + ', Longitude: ' + lon;
              },
              function () {
                document.getElementById('locationDisplay').textContent = 'Unable to fetch your location.';
              }
            );
          });
        </script>
      </section>

      <section>
        <h2>4. Cricket Ball on Canvas</h2>
        <canvas id="cricketCanvas" width="200" height="200"></canvas>
        <script>
          const canvas = document.getElementById('cricketCanvas');
          const ctx = canvas.getContext('2d');

          ctx.beginPath();
          ctx.arc(100, 100, 60, 0, Math.PI * 2);
          ctx.fillStyle = 'red';
          ctx.fill();

          ctx.beginPath();
          ctx.moveTo(70, 100);
          ctx.lineTo(130, 100);
          ctx.lineWidth = 3;
          ctx.strokeStyle = 'white';
          ctx.stroke();
        </script>
      </section>
    </div>
  </body>
</html>
