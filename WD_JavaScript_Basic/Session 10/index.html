<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Contact Us - Feedback Form</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        min-height: 100vh;
        background: linear-gradient(135deg, #eef2ff, #f8fafc);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px;
      }

      .container {
        width: 100%;
        max-width: 900px;
        background: white;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
        display: grid;
        grid-template-columns: 0.9fr 1.1fr;
      }

      /* Left Section */

      .info-section {
        background: #4f46e5;
        color: white;
        padding: 45px 35px;
      }

      .info-section h1 {
        font-size: 32px;
        margin-bottom: 15px;
      }

      .info-section p {
        line-height: 1.7;
        opacity: 0.9;
        margin-bottom: 30px;
      }

      .info-item {
        margin: 22px 0;
      }

      .info-item h3 {
        font-size: 16px;
        margin-bottom: 5px;
      }

      .info-item p {
        margin: 0;
        font-size: 14px;
      }

      /* Form Section */

      .form-section {
        padding: 40px;
      }

      .form-section h2 {
        color: #1e293b;
        font-size: 28px;
        margin-bottom: 8px;
      }

      .subtitle {
        color: #64748b;
        margin-bottom: 25px;
      }

      /* Success Message */

      .success-message {
        display: none;
        background: #dcfce7;
        color: #166534;
        border: 1px solid #86efac;
        padding: 14px;
        border-radius: 8px;
        margin-bottom: 20px;
        font-size: 14px;
      }

      /* Form */

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 7px;
        color: #334155;
        font-weight: bold;
        font-size: 14px;
      }

      input,
      textarea {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        outline: none;
        font-size: 15px;
        transition: 0.2s;
      }

      input:focus,
      textarea:focus {
        border-color: #4f46e5;
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
      }

      textarea {
        height: 130px;
        resize: vertical;
      }

      /* Error */

      .error {
        color: #dc2626;
        font-size: 13px;
        margin-top: 6px;
        min-height: 18px;
      }

      /* Button */

      .submit-btn {
        width: 100%;
        border: none;
        padding: 14px;
        background: #4f46e5;
        color: white;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
      }

      .submit-btn:hover {
        background: #4338ca;
      }

      /* Mobile Responsive */

      @media (max-width: 700px) {
        body {
          padding: 15px;
        }

        .container {
          grid-template-columns: 1fr;
        }

        .info-section {
          padding: 30px 25px;
        }

        .form-section {
          padding: 30px 25px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- =====================================
             Left Information Section
             ===================================== -->

      <div class="info-section">
        <h1>Let's Connect 👋</h1>

        <p>
          We'd love to hear from you. Share your feedback, suggestions, or
          questions with us.
        </p>

        <div class="info-item">
          <h3>📧 Email</h3>

          <p>support@example.com</p>
        </div>

        <div class="info-item">
          <h3>📞 Phone</h3>

          <p>+91 98765 43210</p>
        </div>

        <div class="info-item">
          <h3>📍 Location</h3>

          <p>Gujarat, India</p>
        </div>
      </div>

      <!-- =====================================
             Form Section
             ===================================== -->

      <div class="form-section">
        <h2>Contact Us</h2>

        <p class="subtitle">Send us your valuable feedback.</p>

        <!-- Success Message -->

        <div id="successMessage" class="success-message">
          ✓ Thank you! Your feedback has been submitted successfully.
        </div>

        <!-- Feedback Form -->

        <form id="feedbackForm">
          <!-- Name -->

          <div class="form-group">
            <label for="name"> Full Name </label>

            <input type="text" id="name" placeholder="Enter your name" />

            <div id="nameError" class="error"></div>
          </div>

          <!-- Email -->

          <div class="form-group">
            <label for="email"> Email Address </label>

            <input type="text" id="email" placeholder="user@example.com" />

            <div id="emailError" class="error"></div>
          </div>

          <!-- Message -->

          <div class="form-group">
            <label for="message"> Message </label>

            <textarea
              id="message"
              placeholder="Write your feedback..."
            ></textarea>

            <div id="messageError" class="error"></div>
          </div>

          <!-- Submit -->

          <button type="submit" class="submit-btn">Send Feedback</button>
        </form>
      </div>
    </div>

    <script>
      // ==========================================
      // Get Form Elements
      // ==========================================

      const feedbackForm = document.getElementById("feedbackForm");

      const nameInput = document.getElementById("name");

      const emailInput = document.getElementById("email");

      const messageInput = document.getElementById("message");

      const nameError = document.getElementById("nameError");

      const emailError = document.getElementById("emailError");

      const messageError = document.getElementById("messageError");

      const successMessage = document.getElementById("successMessage");

      // ==========================================
      // Task 4
      // Improved Email Regex suggested by ChatGPT
      // ==========================================

      // Suggested regex:
      // /^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@[a-zA-Z0-9-]+(?:\.[a-zA-Z0-9-]+)*$/

      const emailPattern =
        /^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@[a-zA-Z0-9-]+(?:\.[a-zA-Z0-9-]+)*$/;

      // ==========================================
      // Form Submit
      // ==========================================

      feedbackForm.addEventListener("submit", function (event) {
        // Prevent default form submission
        event.preventDefault();

        // Clear old errors
        nameError.innerHTML = "";
        emailError.innerHTML = "";
        messageError.innerHTML = "";

        successMessage.style.display = "none";

        // Get values
        const name = nameInput.value.trim();

        const email = emailInput.value.trim();

        const message = messageInput.value.trim();

        let isValid = true;

        // ==========================================
        // Name Validation
        // ==========================================

        if (name === "") {
          nameError.innerHTML = "Please enter your name.";

          isValid = false;
        }

        // ==========================================
        // Email Validation
        // ==========================================

        if (email === "") {
          emailError.innerHTML = "Please enter your email.";

          isValid = false;
        } else if (!emailPattern.test(email)) {
          emailError.innerHTML = "Please enter a valid email address.";

          isValid = false;
        }

        // ==========================================
        // Message Validation
        // ==========================================

        if (message === "") {
          messageError.innerHTML = "Please enter your message.";

          isValid = false;
        }

        // ==========================================
        // Success
        // ==========================================

        if (isValid) {
          // Create object
          const feedbackData = {
            name: name,

            email: email,

            message: message,
          };

          // Log data in console
          console.log("Feedback Submitted:", feedbackData);

          // Show success message
          successMessage.style.display = "block";

          // Clear form
          feedbackForm.reset();
        }
      });
    </script>
  </body>
</html>
