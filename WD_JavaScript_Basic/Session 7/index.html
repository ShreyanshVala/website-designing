<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Session 7 - DOM Manipulation</title>

    <style>
      /* General */
      body {
        font-family: Arial, sans-serif;
        padding: 30px;
        transition: 0.3s;
      }

      button {
        padding: 10px 18px;
        margin: 10px 5px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      /* Task 2 - Product Card */
      .product-card {
        width: 300px;
        padding: 20px;
        margin: 20px 0;
        border: 1px solid #ddd;
        border-radius: 10px;
      }

      .price {
        font-size: 24px;
        font-weight: bold;
      }

      /* Task 3 - Dark Theme */
      .dark-theme {
        background-color: #222;
        color: white;
      }

      /* Task 4 - Restaurants */
      .restaurant {
        width: 300px;
        padding: 15px;
        margin: 10px 0;
        border: 1px solid #ccc;
        cursor: pointer;
        border-radius: 5px;
      }

      .selected {
        background-color: green;
        color: white;
      }
    </style>
  </head>

  <body>
    <!-- ==========================================
         Task 1
         getElementById
         ========================================== -->

    <h1 id="playlistHeading">Welcome to My Playlist</h1>

    <button id="playlistButton">Change Playlist</button>

    <hr />

    <!-- ==========================================
         Task 2
         querySelector
         ========================================== -->

    <h2>Product Card</h2>

    <div class="product-card">
      <h3>Wireless Headphones</h3>

      <p id="productPrice" class="price">₹1,499</p>

      <button id="priceButton">Show Best Price</button>
    </div>

    <hr />

    <!-- ==========================================
         Task 3
         Dark Mode
         ========================================== -->

    <h2>Theme</h2>

    <button id="darkModeButton">Dark Mode</button>

    <hr />

    <!-- ==========================================
         Task 4
         Restaurant List
         ========================================== -->

    <h2>Zomato Restaurant List</h2>

    <div class="restaurant">Domino's Pizza</div>

    <div class="restaurant">Honest Restaurant</div>

    <div class="restaurant">The Grand Thakar</div>

    <!-- ==========================================
         JavaScript
         ========================================== -->

    <script>
      // ==========================================
      // Task 1
      // getElementById
      // ==========================================

      let playlistButton = document.getElementById("playlistButton");

      playlistButton.addEventListener("click", function () {
        let heading = document.getElementById("playlistHeading");

        heading.textContent = "Your Spotify Playlist";
      });

      // ==========================================
      // Task 2
      // querySelector
      // ==========================================

      let priceButton = document.querySelector("#priceButton");

      priceButton.addEventListener("click", function () {
        let price = document.querySelector("#productPrice");

        price.style.color = "green";
      });

      // ==========================================
      // Task 3
      // Dark Mode
      // ==========================================

      let darkModeButton = document.getElementById("darkModeButton");

      darkModeButton.addEventListener("click", function () {
        document.body.classList.add("dark-theme");
      });

      // ==========================================
      // Task 4
      // Restaurant Selection
      // ==========================================

      let restaurants = document.querySelectorAll(".restaurant");

      restaurants.forEach(function (restaurant) {
        restaurant.addEventListener("click", function () {
          // Remove selected class from all restaurants
          restaurants.forEach(function (item) {
            item.classList.remove("selected");
          });

          // Add selected class to clicked restaurant
          restaurant.classList.add("selected");
        });
      });
    </script>
  </body>
</html>
