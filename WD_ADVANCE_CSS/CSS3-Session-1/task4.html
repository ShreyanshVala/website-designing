<!doctype html>
<html>
  <head>
    <title>CSS2 vs CSS3</title>
  </head>

  <body>
    <h1>CSS2 vs CSS3</h1>

    <table border="1" cellpadding="10">
      <tr>
        <th>CSS3 Effect</th>
        <th>CSS2</th>
        <th>CSS3 Property</th>
        <th>Real App / Website</th>
      </tr>

      <tr>
        <td>Rounded Corners</td>
        <td>Not directly possible</td>
        <td>border-radius</td>
        <td>Spotify</td>
      </tr>

      <tr>
        <td>Drop Shadows</td>
        <td>Not directly possible</td>
        <td>box-shadow</td>
        <td>Google</td>
      </tr>

      <tr>
        <td>Gradients</td>
        <td>Not directly possible</td>
        <td>linear-gradient()</td>
        <td>Instagram</td>
      </tr>
    </table>
  </body>
</html>
