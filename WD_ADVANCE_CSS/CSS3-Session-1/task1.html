<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS3 Modern Card</title>

    <style>
      .card {
        width: 300px;
        padding: 30px;
        margin: 50px auto;
        background-color: white;

        /* CSS3 Features */
        border-radius: 20px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);

        text-align: center;
        font-family: Arial, sans-serif;
      }

      body {
        background-color: #f2f2f2;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <h2>Modern Card</h2>
      <p>This card uses CSS3 rounded corners and a drop shadow.</p>
    </div>
  </body>
</html>
