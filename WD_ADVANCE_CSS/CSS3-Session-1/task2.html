<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playlist Card</title>

    <style>
      body {
        background-color: #121212;
        font-family: Arial, sans-serif;
      }

      .playlist-card {
        width: 320px;
        margin: 50px auto;
        padding: 25px;

        /* CSS3 Gradient */
        background: linear-gradient(135deg, #1db954, #191414);

        /* Rounded Corners */
        border-radius: 20px;

        /* Shadow */
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);

        color: white;
      }

      .playlist-card h2 {
        margin-bottom: 10px;
      }

      .playlist-card p {
        color: #dddddd;
      }

      .song {
        background: rgba(255, 255, 255, 0.1);
        padding: 12px;
        margin: 8px 0;
        border-radius: 10px;
      }
    </style>
  </head>

  <body>
    <div class="playlist-card">
      <h2>🎵 My Playlist</h2>
      <p>My favorite songs</p>

      <div class="song">01. Perfect - Ed Sheeran</div>
      <div class="song">02. Believer - Imagine Dragons</div>
      <div class="song">03. Shape of You - Ed Sheeran</div>
      <div class="song">04. Memories - Maroon 5</div>
    </div>
  </body>
</html>
